<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Pokémon Move Battle Online
  </title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffe066,
          #ff6b6b
        );

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;
    }

    .game-box {

      background: white;

      padding: 30px;

      border-radius: 25px;

      width: 90%;

      max-width: 800px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.2);

      text-align: center;
    }

    h1 {

      margin-bottom: 10px;
    }

    .players {

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 20px;
    }

    #roomCodeText {

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 15px;

      color: #e63946;
    }

    .hidden {

      display: none;
    }

    button {

      background: #ffcc00;

      border: none;

      padding: 12px 20px;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      margin: 5px;
    }

    button:hover {

      background: #ffb700;
    }

    input,
    select {

      width: 90%;

      padding: 12px;

      font-size: 18px;

      border-radius: 12px;

      border: 2px solid #ccc;

      margin-bottom: 15px;

      box-sizing: border-box;
    }

    .timer {

      font-size: 72px;

      color: #e63946;

      font-weight: bold;

      margin: 15px 0;
    }

    .message {

      font-size: 20px;

      font-weight: bold;

      min-height: 30px;

      margin-top: 10px;
    }

    .move-count {

      font-size: 24px;

      font-weight: bold;

      margin: 10px 0;
    }

    .moves-list {

      margin-top: 20px;

      background: #f1f1f1;

      padding: 10px;

      border-radius: 12px;

      max-height: 250px;

      overflow-y: auto;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      text-align: left;
    }

    .move-tag {

      background: #90caf9;

      padding: 5px 10px;

      border-radius: 8px;

      font-size: 14px;
    }

  </style>

</head>

<body>

  <div class="game-box">

    <h1>
      Pokémon Move Battle
    </h1>

    <div
      class="players"
      id="playersList"
    >
    </div>

    <div id="roomMenu">

      <input
        type="text"
        id="usernameInput"
        placeholder="Enter Username"
      />

      <select id="maxPlayersSelect">

        <option value="2">
          2 Players
        </option>

        <option value="3">
          3 Players
        </option>

        <option value="4">
          4 Players
        </option>

        <option value="5">
          5 Players
        </option>

        <option value="6">
          6 Players
        </option>

        <option value="7">
          7 Players
        </option>

        <option value="8">
          8 Players
        </option>

      </select>

      <button onclick="createRoom()">
        Create Room
      </button>

      <br />

      <input
        type="text"
        id="roomJoinInput"
        placeholder="Enter Room Code"
      />

      <button onclick="joinRoom()">
        Join Room
      </button>

    </div>

    <div
      id="gameUI"
      class="hidden"
    >

      <div id="roomCodeText">
        Room Code: -----
      </div>

      <h2 id="turnText">
        Waiting For Players
      </h2>

      <div
        class="timer hidden"
        id="timer"
      >
        60
      </div>

      <div
        class="move-count"
        id="moveCount"
      >
        0 Moves Used
      </div>

      <input
        class="hidden"
        type="text"
        id="moveInput"
        placeholder="Enter a Pokémon move"
        autocomplete="off"
      />

      <button
        class="hidden"
        onclick="submitMove()"
        id="submitButton"
      >
        Submit Move
      </button>

      <div
        class="message"
        id="message"
      >
      </div>

      <div
        class="moves-list"
        id="movesList"
      >
      </div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    let roomCode = "";

    let username = "";

    let myPlayerNumber = null;

    let currentPlayer = 0;

    let usedMoves = [];

    let pokemonMoves = [];

    let gameOver = false;

    const playersList =
      document.getElementById(
        "playersList"
      );

    const roomMenu =
      document.getElementById(
        "roomMenu"
      );

    const roomCodeText =
      document.getElementById(
        "roomCodeText"
      );

    const turnText =
      document.getElementById(
        "turnText"
      );

    const timerElement =
      document.getElementById(
        "timer"
      );

    const moveCount =
      document.getElementById(
        "moveCount"
      );

    const moveInput =
      document.getElementById(
        "moveInput"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const movesList =
      document.getElementById(
        "movesList"
      );

    async function loadMoves() {

      try {

        const response =
          await fetch(
            "https://pokeapi.co/api/v2/move?limit=10000"
          );

        const data =
          await response.json();

        pokemonMoves =
          data.results.map(move =>
            move.name
              .split("-")
              .map(word =>
                word.charAt(0)
                  .toUpperCase() +
                word.slice(1)
              )
              .join(" ")
          );

        message.textContent =
          `Loaded ${pokemonMoves.length} moves!`;

      } catch {

        message.textContent =
          "Failed to load moves.";
      }
    }

    loadMoves();

    function createRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) return;

      socket.emit(
        "createRoom",
        {
          username,

          maxPlayers:
            parseInt(
              document
                .getElementById(
                  "maxPlayersSelect"
                ).value
            )
        }
      );
    }

    function joinRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) return;

      roomCode =
        document
          .getElementById(
            "roomJoinInput"
          )
          .value
          .trim();

      socket.emit(
        "joinRoom",
        {
          roomCode,
          username
        }
      );
    }

    socket.on(
      "roomCreated",
      code => {

        roomCode = code;

        roomMenu.classList.add(
          "hidden"
        );

        document
          .getElementById(
            "gameUI"
          )
          .classList.remove(
            "hidden"
          );

        roomCodeText.innerHTML =
          `Room Code: <b>${roomCode}</b>`;

        message.textContent =
          "Waiting for players...";
      }
    );

    socket.on(
      "joinSuccess",
      () => {

        roomMenu.classList.add(
          "hidden"
        );

        document
          .getElementById(
            "gameUI"
          )
          .classList.remove(
            "hidden"
          );

        roomCodeText.innerHTML =
          `Room Code: <b>${roomCode}</b>`;
      }
    );

    socket.on(
      "playerNumber",
      number => {

        myPlayerNumber =
          number;
      }
    );

    socket.on(
      "updatePlayers",
      players => {

        playersList.innerHTML =
          "";

        for (
          let i = 0;
          i < players.length;
          i++
        ) {

          const div =
            document.createElement(
              "div"
            );

          div.textContent =
            `Player ${i + 1}: ${players[i].username}`;

          playersList.appendChild(
            div
          );
        }
      }
    );

    socket.on(
      "gameStart",
      data => {

        currentPlayer =
          data.currentPlayer;

        moveInput.classList.remove(
          "hidden"
        );

        submitButton.classList.remove(
          "hidden"
        );

        timerElement.classList.remove(
          "hidden"
        );

        timerElement.textContent =
          data.timer;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            `${data.currentUsername}'s Turn`;
        }

        message.textContent =
          "Game started!";
      }
    );

    socket.on(
      "timerUpdate",
      time => {

        timerElement.textContent =
          time;
      }
    );

    socket.on(
      "errorMessage",
      msg => {

        message.textContent =
          msg;
      }
    );

    socket.on(
      "moveAccepted",
      data => {

        usedMoves =
          data.usedMoves;

        currentPlayer =
          data.currentPlayer;

        timerElement.textContent =
          data.timer;

        moveCount.textContent =
          `${usedMoves.length} / ${pokemonMoves.length} Moves Used`;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            `${data.currentUsername}'s Turn`;
        }

        movesList.innerHTML =
          "";

        usedMoves.forEach(
          move => {

            const tag =
              document.createElement(
                "div"
              );

            tag.className =
              "move-tag";

            tag.textContent =
              move;

            movesList.appendChild(
              tag
            );
          }
        );

        message.textContent =
          `${data.move} accepted!`;
      }
    );

    socket.on(
      "gameOver",
      data => {

        gameOver = true;

        turnText.textContent =
          "Game Over";

        message.textContent =
          `${data.loser} ran out of time!`;
      }
    );

    function submitMove() {

      if (gameOver) return;

      if (
        myPlayerNumber !==
        currentPlayer
      ) {

        message.textContent =
          "Not your turn!";

        return;
      }

      const input =
        moveInput.value.trim();

      if (!input) return;

      const validMove =
        pokemonMoves.find(
          move =>
            move.toLowerCase() ===
            input.toLowerCase()
        );

      if (!validMove) {

        message.textContent =
          "Invalid move!";

        return;
      }

      socket.emit(
        "startTimer",
        roomCode
      );

      socket.emit(
        "submitMove",
        {
          roomCode,
          move: validMove
        }
      );

      moveInput.value =
        "";

      moveInput.focus();
    }

    moveInput.addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          submitMove();
        }
      }
    );

  </script>

</body>

</html>
