<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Pokémon Move Battle Online</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe066, #ff6b6b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-box {
      background: white;
      padding: 30px;
      border-radius: 25px;
      width: 90%;
      max-width: 750px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }

    .room-menu {
      margin-bottom: 25px;
    }

    .room-menu input {
      width: 250px;
      margin: 5px;
    }

    button {
      background: #ffcc00;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #ffb700;
    }

    input {
      width: 90%;
      padding: 12px;
      font-size: 18px;
      border-radius: 12px;
      border: 2px solid #ccc;
      margin-bottom: 15px;
    }

    .timer {
      font-size: 72px;
      color: #e63946;
      font-weight: bold;
      margin: 15px 0;
    }

    .message {
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
      margin-top: 10px;
    }

    .move-count {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .round-display {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
      color: #444;
    }

    .type-display {
      font-size: 24px;
      color: #0077b6;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .players {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .moves-list {
      margin-top: 20px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 12px;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      text-align: left;
    }

    .move-tag {
      background: #90caf9;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 14px;
    }

  </style>
</head>

<body>

  <div class="game-box">

    <h1>Pokémon Move Battle</h1>

    <div id="roomMenu" class="room-menu">

      <input
        type="text"
        id="usernameInput"
        placeholder="Enter Username"
      />

      <br />

      <button onclick="createRoom()">
        Create Room
      </button>

      <br />

      <input
        type="text"
        id="roomJoinInput"
        placeholder="Enter Room Code"
      />

      <br />

      <button onclick="joinRoom()">
        Join Room
      </button>

    </div>

    <div id="gameUI" class="hidden">

      <div id="roomCodeText"></div>

      <div class="players">

      <div id="player1Text">
        Player 1: Waiting...
      </div>

      <div id="player2Text">
        Player 2: Waiting...
      </div>

      </div>

      <div class="round-display" id="roundDisplay">
        Round 1: All Moves
      </div>

      <div class="type-display" id="typeDisplay"></div>

      <h2 id="turnText">
        Waiting For First Move
      </h2>

      <div class="timer" id="timer">
        60
      </div>

      <div class="move-count" id="moveCount">
        0 / 937 Moves Used
      </div>

      <input
        type="text"
        id="moveInput"
        placeholder="Enter a Pokémon move"
        autocomplete="off"
      />

      <br />

      <button onclick="submitMove()">
        Submit Move
      </button>

      <div class="message" id="message">
      </div>

      <div class="moves-list" id="movesList"></div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    let roomCode = "";

    let myPlayerNumber = null;

    let username = "";

    let currentPlayer = 1;

    let usedMoves = [];

    let pokemonMoves = [];

    let timer = 60;

    let timerStarted = false;

    let gameOver = false;

    let currentRound = 1;

    let currentType = "";

    const TOTAL_MOVES = 937;

    const TYPES = [
      "Fire",
      "Water",
      "Grass",
      "Electric",
      "Ice",
      "Fighting",
      "Poison",
      "Ground",
      "Flying",
      "Psychic",
      "Bug",
      "Rock",
      "Ghost",
      "Dragon",
      "Dark",
      "Steel",
      "Fairy",
      "Normal"
    ];

    const roomMenu =
      document.getElementById("roomMenu");

    const gameUI =
      document.getElementById("gameUI");

    const roomCodeText =
      document.getElementById("roomCodeText");

    const playersText =
      document.getElementById("playersText");

    const roundDisplay =
      document.getElementById("roundDisplay");

    const typeDisplay =
      document.getElementById("typeDisplay");

    const turnText =
      document.getElementById("turnText");

    const timerElement =
      document.getElementById("timer");

    const moveCount =
      document.getElementById("moveCount");

    const moveInput =
      document.getElementById("moveInput");

    const message =
      document.getElementById("message");

    const movesList =
      document.getElementById("movesList");

    async function loadMoves() {

      const response =
        await fetch(
          "https://pokeapi.co/api/v2/move?limit=10000"
        );

      const data =
        await response.json();

      pokemonMoves =
        data.results.map(move =>
          move.name
            .split("-")
            .map(word =>
              word.charAt(0).toUpperCase() +
              word.slice(1)
            )
            .join(" ")
        );
    }

    loadMoves();

    function createRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) return;

      roomCode =
        Math.random()
          .toString(36)
          .substring(2, 7);

      socket.emit(
        "createRoom",
        {
          roomCode,
          username
        }
      );

      roomMenu.classList.add("hidden");

      gameUI.classList.remove("hidden");

      roomCodeText.textContent =
        `Room Code: ${roomCode}`;
    }

    function joinRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) return;

      roomCode =
        document
          .getElementById(
            "roomJoinInput"
          )
          .value
          .trim()
          .toLowerCase();

      socket.emit(
        "joinRoom",
        {
          roomCode,
          username
        }
      );

      roomMenu.classList.add("hidden");

      gameUI.classList.remove("hidden");

      roomCodeText.textContent =
        `Room Code: ${roomCode}`;
    }

    socket.on(
      "playerNumber",
      number => {

        myPlayerNumber = number;
      }
    );

    socket.on(
      "updatePlayers",
      data => {

        playersText.textContent =
          `Player 1: ${data.player1} | Player 2: ${data.player2}`;
      }
    );

    socket.on(
      "gameStart",
      () => {

        message.textContent =
          "Both players connected!";
      }
    );

    socket.on(
      "startTimer",
      () => {

        timerStarted = true;
      }
    );

    socket.on(
      "errorMessage",
      msg => {

        message.textContent = msg;
      }
    );

    socket.on(
      "roundUpdate",
      data => {

        currentRound =
          data.round;

        currentType =
          data.type;

        if (currentRound === 1) {

          roundDisplay.textContent =
            "Round 1: All Moves";

          typeDisplay.textContent = "";
        }

        if (currentRound === 2) {

          roundDisplay.textContent =
            "Round 2: Type Moves";

          typeDisplay.textContent =
            `Type: ${currentType}`;
        }

        if (currentRound === 3) {

          roundDisplay.textContent =
            "Round 3: Signature Moves";

          typeDisplay.textContent = "";
        }
      }
    );

    socket.on(
      "moveAccepted",
      data => {

        usedMoves =
          data.usedMoves;

        currentPlayer =
          data.currentPlayer;

        moveCount.textContent =
          `${usedMoves.length} / 937 Moves Used`;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            "Opponent's Turn";
        }

        movesList.innerHTML = "";

        usedMoves.forEach(move => {

          const tag =
            document.createElement("div");

          tag.className =
            "move-tag";

          tag.textContent =
            move;

          movesList.appendChild(tag);
        });

        message.textContent =
          `${data.move} accepted!`;
      }
    );

    setInterval(() => {

      if (
        !timerStarted ||
        gameOver
      ) return;

      timer--;

      timerElement.textContent =
        timer;

      if (timer <= 0) {

        gameOver = true;

        const winner =
          currentPlayer === 1
            ? 2
            : 1;

        turnText.textContent =
          "Game Over";

        message.textContent =
          `Player ${winner} wins!`;
      }

    }, 1000);

    function submitMove() {

      if (gameOver) return;

      if (
        myPlayerNumber !==
        currentPlayer
      ) {

        message.textContent =
          "Not your turn!";

        return;
      }

      const input =
        moveInput.value.trim();

      if (!input) return;

      const validMove =
        pokemonMoves.find(
          move =>
            move.toLowerCase() ===
            input.toLowerCase()
        );

      if (!validMove) {

        message.textContent =
          "Invalid move!";

        return;
      }

      if (
        !timerStarted
      ) {

        socket.emit(
          "startTimer",
          roomCode
        );
      }

      socket.emit(
        "submitMove",
        {
          roomCode,
          move: validMove
        }
      );

      moveInput.value = "";

      moveInput.focus();
    }

    moveInput.addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          submitMove();
        }
      }
    );

  </script>

</body>
</html>
