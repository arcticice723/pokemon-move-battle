<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Pokémon Move Battle Online</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe066, #ff6b6b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-box {
      background: white;
      padding: 30px;
      border-radius: 25px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .room-code {
      font-size: 22px;
      margin-bottom: 15px;
      color: #333;
    }

    .timer {
      font-size: 64px;
      color: #e63946;
      font-weight: bold;
      margin: 20px 0;
    }

    .move-count {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #444;
    }

    input {
      width: 90%;
      padding: 12px;
      font-size: 18px;
      border-radius: 12px;
      border: 2px solid #ccc;
      margin-bottom: 15px;
    }

    button {
      background: #ffcc00;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #ffb700;
    }

    .message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
    }

    .used-moves {
      margin-top: 25px;
      text-align: left;
    }

    .moves-list {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 12px;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .move-tag {
      background: #90caf9;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="game-box">

    <h1>Pokémon Move Battle</h1>

    <div class="room-code" id="roomCodeText">
      Not Connected
    </div>

    <button onclick="createRoom()">
      Create Room
    </button>

    <button onclick="joinRoom()">
      Join Room
    </button>

    <h2 id="turnText">
      Waiting For Players
    </h2>

    <div class="timer" id="timer">
      60
    </div>

    <div class="move-count" id="moveCount">
      0 / 937 Moves Used
    </div>

    <input
      type="text"
      id="moveInput"
      placeholder="Enter a Pokémon move"
      autocomplete="off"
    />

    <br />

    <button onclick="submitMove()">
      Submit Move
    </button>

    <div class="message" id="message">
      Create or join a room!
    </div>

    <div class="used-moves">

      <h3>Used Moves</h3>

      <div class="moves-list" id="movesList"></div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    let roomCode = "";

    let myPlayerNumber = null;

    let pokemonMoves = [];

    let currentPlayer = 1;

    let timer = 60;

    let usedMoves = [];

    let gameOver = false;

    const TOTAL_MOVES = 937;

    const timerElement =
      document.getElementById("timer");

    const turnText =
      document.getElementById("turnText");

    const message =
      document.getElementById("message");

    const moveInput =
      document.getElementById("moveInput");

    const movesList =
      document.getElementById("movesList");

    const roomCodeText =
      document.getElementById("roomCodeText");

    const moveCount =
      document.getElementById("moveCount");

    async function loadMoves() {

      try {

        const response = await fetch(
          "https://pokeapi.co/api/v2/move?limit=10000"
        );

        const data = await response.json();

        pokemonMoves = data.results.map(move =>
          move.name
            .split("-")
            .map(word =>
              word.charAt(0).toUpperCase() +
              word.slice(1)
            )
            .join(" ")
        );

        message.textContent =
          `Loaded ${pokemonMoves.length} Pokémon moves!`;

      } catch (error) {

        message.textContent =
          "Failed to load Pokémon moves.";

        console.error(error);
      }
    }

    loadMoves();

    function updateMoveCounter() {

      moveCount.textContent =
        `${usedMoves.length} / ${TOTAL_MOVES} Moves Used`;
    }

    function createRoom() {

      roomCode =
        Math.random()
          .toString(36)
          .substring(2, 7);

      socket.emit(
        "createRoom",
        roomCode
      );

      roomCodeText.textContent =
        `Room: ${roomCode}`;

      message.textContent =
        "Waiting for Player 2...";
    }

    function joinRoom() {

      const inputCode =
        prompt("Enter Room Code:");

      if (!inputCode) return;

      roomCode =
        inputCode.toLowerCase();

      socket.emit(
        "joinRoom",
        roomCode
      );

      roomCodeText.textContent =
        `Room: ${roomCode}`;
    }

    socket.on(
      "playerNumber",
      number => {

        myPlayerNumber = number;

        message.textContent =
          `You are Player ${number}`;
      }
    );

    socket.on(
      "gameStart",
      () => {

        message.textContent =
          "Game started!";
      }
    );

    socket.on(
      "errorMessage",
      msg => {

        message.textContent = msg;
      }
    );

    socket.on(
      "moveAccepted",
      data => {

        usedMoves = data.usedMoves;

        currentPlayer =
          data.currentPlayer;

        timer = 60;

        timerElement.textContent =
          timer;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            `Player ${currentPlayer}'s Turn`;
        }

        message.textContent =
          `${data.move} accepted!`;

        movesList.innerHTML = "";

        usedMoves.forEach(move => {

          const tag =
            document.createElement("div");

          tag.className =
            "move-tag";

          tag.textContent =
            move;

          movesList.appendChild(tag);
        });

        updateMoveCounter();
      }
    );

    const countdown =
      setInterval(() => {

        if (gameOver) return;

        timer--;

        timerElement.textContent =
          timer;

        if (timer <= 0) {

          gameOver = true;

          const winner =
            currentPlayer === 1
              ? 2
              : 1;

          message.textContent =
            `Time's up! Player ${winner} wins!`;

          turnText.textContent =
            "Game Over";
        }

      }, 1000);

    function submitMove() {

      if (gameOver) return;

      if (
        myPlayerNumber !==
        currentPlayer
      ) {

        message.textContent =
          "It's not your turn!";

        return;
      }

      const input =
        moveInput.value.trim();

      if (!input) return;

      const validMove =
        pokemonMoves.find(
          move =>
            move.toLowerCase() ===
            input.toLowerCase()
        );

      if (!validMove) {

        message.textContent =
          "Not a valid Pokémon move!";

        return;
      }

      socket.emit(
        "submitMove",
        {
          roomCode,
          move: validMove
        }
      );

      moveInput.value = "";

      moveInput.focus();
    }

    moveInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          submitMove();
        }
      }
    );

    updateMoveCounter();

  </script>

</body>
</html>
