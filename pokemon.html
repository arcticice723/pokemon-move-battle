<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Pokémon Move Battle Online
  </title>

  <style>

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 15% 0%, #20254a 0, transparent 42%), #090d18;
      color: #f4f7ff;
      min-height: 100vh;
    }
    .site-header {
      width: min(1120px, calc(100% - 36px));
      margin: auto;
      padding: 18px 0;
      border-bottom: 1px solid #ffffff18;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand { color: #f4f7ff; text-decoration: none; display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 900; letter-spacing: -.04em; }
    .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 12px; background: linear-gradient(135deg,#8b7cff,#5ce1e6); color: #080d18; }
    .top-join { display: flex; gap: 8px; align-items: center; flex: 1; justify-content: center; }
    .top-join input { width: min(190px, 42vw); margin: 0; padding: 10px 12px; font-size: 15px; background: #0c1322; color: #f4f7ff; border: 1px solid #2a3854; }
    .back { color: #c5cce0; text-decoration: none; font-weight: 700; white-space: nowrap; }
    @media(max-width:700px) { .top-join { order: 3; width: 100%; flex-basis: 100%; justify-content: flex-start; } .site-header { align-items: center; } }

    .game-box {

      background: #121a2b;
      color: #f4f7ff;
      padding: 30px;
      border: 1px solid #2a3854;
      border-radius: 22px;
      width: min(800px, calc(100% - 36px));
      box-sizing: border-box;
      margin: 34px auto 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      text-align: center;
    }

    h1 {

      margin-bottom: 10px;
    }

    .players {

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 20px;
    }

    #roomCodeText {

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 15px;

      color: #5ce1e6;
    }

    .hidden {

      display: none;
    }

    button {

      background: #8b7cff;
      color: white;
      border: 1px solid transparent;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {

      background: #a096ff;
    }

    input,
    select {

      width: 90%;

      padding: 12px;

      font-size: 18px;

      border-radius: 12px;

      border: 1px solid #2a3854;
      background: #0c1322;
      color: #f4f7ff;
      margin-bottom: 15px;

      box-sizing: border-box;
    }

    .timer {

      font-size: 72px;

      color: #5ce1e6;

      font-weight: bold;

      margin: 15px 0;
    }

    .message {

      font-size: 20px;

      font-weight: bold;

      min-height: 30px;

      margin-top: 10px;
    }

    .move-count {

      font-size: 24px;

      font-weight: bold;

      margin: 10px 0;
    }

    .moves-list {

      margin-top: 20px;

      background: #0c1322;
      border: 1px solid #2a3854;
      padding: 10px;
      border-radius: 12px;

      max-height: 250px;

      overflow-y: auto;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      text-align: left;
    }

    .move-tag {

      background: #263453;

      padding: 5px 10px;

      border-radius: 8px;

      font-size: 14px;
    }

  </style>

</head>

<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">N</span>NEXUS</a>
    <div class="top-join">
      <input type="text" id="roomJoinInput" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="Enter 5-digit room code" aria-label="Room code">
      <button type="button" onclick="joinRoom()">Join Room</button>
    </div>
    <a class="back" href="/">All games</a>
  </header>
  <div class="game-box">

    <h1>
      Pokémon Move Battle
    </h1>

    <div
      class="players"
      id="playersList"
    >
    </div>

    <div id="roomMenu">

      <input
        type="text"
        id="usernameInput"
        placeholder="Enter Username"
      />

      <select id="maxPlayersSelect">

        <option value="2">
          2 Players
        </option>

        <option value="3">
          3 Players
        </option>

        <option value="4">
          4 Players
        </option>

        <option value="5">
          5 Players
        </option>

        <option value="6">
          6 Players
        </option>

        <option value="7">
          7 Players
        </option>

        <option value="8">
          8 Players
        </option>

      </select>

      <button onclick="createRoom()">
        Create Room
      </button>

      <p style="color:#9eacc7">To join a room, enter its 5-digit code in the top bar.</p>

    </div>

    <div
      id="gameUI"
      class="hidden"
    >

      <div id="roomCodeText">
        Room Code: -----
      </div>

      <h2 id="turnText">
        Waiting For Players
      </h2>

      <div
        class="timer hidden"
        id="timer"
      >
        60
      </div>

      <div
        class="move-count"
        id="moveCount"
      >
        0 Moves Used
      </div>

      <input
        class="hidden"
        type="text"
        id="moveInput"
        placeholder="Enter a Pokémon move"
        autocomplete="off"
      />

      <button
        class="hidden"
        onclick="submitMove()"
        id="submitButton"
      >
        Submit Move
      </button>

      <div
        class="message"
        id="message"
      >
      </div>

      <div
        class="moves-list"
        id="movesList"
      >
      </div>

    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    let roomCode = "";

    let username = "";

    let myPlayerNumber = null;

    let currentPlayer = 0;

    let usedMoves = [];

    let pokemonMoves = [];

    let gameOver = false;

    const playersList =
      document.getElementById(
        "playersList"
      );

    const roomMenu =
      document.getElementById(
        "roomMenu"
      );

    const roomCodeText =
      document.getElementById(
        "roomCodeText"
      );

    const turnText =
      document.getElementById(
        "turnText"
      );

    const timerElement =
      document.getElementById(
        "timer"
      );

    const moveCount =
      document.getElementById(
        "moveCount"
      );

    const moveInput =
      document.getElementById(
        "moveInput"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const movesList =
      document.getElementById(
        "movesList"
      );

    let resumeToken = "";
    function freshResumeToken(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+"-"+Math.random().toString(36).slice(2);}
    function saveSession(game){localStorage.setItem("nexusSession",JSON.stringify({game,roomCode,username,resumeToken}));}
    function prepareSession(){resumeToken=freshResumeToken();return resumeToken;}
    socket.on("connect",()=>{try{const saved=JSON.parse(localStorage.getItem("nexusSession")||"null");if(saved&&saved.game==="pokemon"&&saved.roomCode&&saved.resumeToken){roomCode=saved.roomCode;username=saved.username||"";resumeToken=saved.resumeToken;document.getElementById("usernameInput").value=username;document.getElementById("roomJoinInput").value=roomCode;message.textContent="Rejoining your room…";socket.emit("resumeRoom",{game:"pokemon",roomCode,resumeToken});}}catch{}});
    socket.on("roomResumed",data=>{roomCode=data.roomCode;username=data.username;myPlayerNumber=data.playerNumber;currentPlayer=data.currentPlayer;usedMoves=data.usedMoves||[];gameOver=!!data.gameOver;roomMenu.classList.add("hidden");document.getElementById("gameUI").classList.remove("hidden");roomCodeText.innerHTML="Room Code: <b>"+roomCode+"</b>";moveCount.textContent=usedMoves.length+" / "+pokemonMoves.length+" Moves Used";movesList.innerHTML="";usedMoves.forEach(move=>{const tag=document.createElement("div");tag.className="move-tag";tag.textContent=move;movesList.appendChild(tag)});if(data.gameStarted){moveInput.classList.remove("hidden");submitButton.classList.remove("hidden");timerElement.classList.remove("hidden");timerElement.textContent=data.timer;turnText.textContent=currentPlayer===myPlayerNumber?"Your Turn":(data.players[currentPlayer]?.username||"Opponent")+"'s Turn";}message.textContent="Rejoined room "+roomCode+".";if(gameOver){turnText.textContent="Game Over";}});

    async function loadMoves() {

      try {

        const response =
          await fetch(
            "https://pokeapi.co/api/v2/move?limit=10000"
          );

        const data =
          await response.json();

        pokemonMoves =
          data.results.map(move =>
            move.name
              .split("-")
              .map(word =>
                word.charAt(0)
                  .toUpperCase() +
                word.slice(1)
              )
              .join(" ")
          );

        message.textContent =
          `Loaded ${pokemonMoves.length} moves!`;

      } catch {

        message.textContent =
          "Failed to load moves.";
      }
    }

    loadMoves();

    function createRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) { message.textContent = "Enter a username first, then join using the code in the top bar."; document.getElementById("usernameInput").focus(); return; }

      socket.emit(
        "createRoom",
        {
          username,
          resumeToken: prepareSession(),

          maxPlayers:
            parseInt(
              document
                .getElementById(
                  "maxPlayersSelect"
                ).value
            )
        }
      );
    }

    function joinRoom() {

      username =
        document
          .getElementById(
            "usernameInput"
          )
          .value
          .trim();

      if (!username) { message.textContent = "Enter a username first."; document.getElementById("usernameInput").focus(); return; }

      roomCode = document.getElementById("roomJoinInput").value.trim();
      if (!/^\d{5}$/.test(roomCode)) {
        message.textContent = "Enter the 5-digit room code shown by the host.";
        document.getElementById("roomJoinInput").focus();
        return;
      }

      message.textContent = "Joining room " + roomCode + "…";
      socket.emit("joinRoom", { roomCode, username, resumeToken: prepareSession() });
    }

    socket.on(
      "roomCreated",
      code => {

        roomCode = code;
        saveSession("pokemon");

        roomMenu.classList.add(
          "hidden"
        );

        document
          .getElementById(
            "gameUI"
          )
          .classList.remove(
            "hidden"
          );

        roomCodeText.innerHTML =
          `Room Code: <b>${roomCode}</b>`;

        message.textContent =
          "Waiting for players...";
      }
    );

    socket.on(
      "joinSuccess",
      () => {
        saveSession("pokemon");

        roomMenu.classList.add(
          "hidden"
        );

        document
          .getElementById(
            "gameUI"
          )
          .classList.remove(
            "hidden"
          );

        roomCodeText.innerHTML =
          `Room Code: <b>${roomCode}</b>`;
      }
    );

    socket.on(
      "playerNumber",
      number => {

        myPlayerNumber =
          number;
      }
    );

    socket.on(
      "updatePlayers",
      players => {

        playersList.replaceChildren();
        players.forEach((player, index) => {
          const div = document.createElement("div");
          div.style.cssText = "display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#0c1322;margin:5px 0";
          if (player.avatarData) {
            const img = document.createElement("img");
            img.src = player.avatarData;
            img.alt = "";
            img.style.cssText = "width:32px;height:32px;object-fit:cover;border-radius:50%";
            div.appendChild(img);
          }
          const name = document.createElement("span");
          name.textContent = `Player ${index + 1}: ${player.username}`;
          div.appendChild(name);
          playersList.appendChild(div);
        });
      }
    );

    socket.on(
      "gameStart",
      data => {

        currentPlayer =
          data.currentPlayer;

        moveInput.classList.remove(
          "hidden"
        );

        submitButton.classList.remove(
          "hidden"
        );

        timerElement.classList.remove(
          "hidden"
        );

        timerElement.textContent =
          data.timer;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            `${data.currentUsername}'s Turn`;
        }

        message.textContent =
          "Game started!";
      }
    );

    socket.on(
      "timerUpdate",
      time => {

        timerElement.textContent =
          time;
      }
    );

    socket.on(
      "errorMessage",
      msg => {

        message.textContent =
          msg;
      }
    );

    socket.on(
      "moveAccepted",
      data => {

        usedMoves =
          data.usedMoves;

        currentPlayer =
          data.currentPlayer;

        timerElement.textContent =
          data.timer;

        moveCount.textContent =
          `${usedMoves.length} / ${pokemonMoves.length} Moves Used`;

        if (
          currentPlayer ===
          myPlayerNumber
        ) {

          turnText.textContent =
            "Your Turn";

        } else {

          turnText.textContent =
            `${data.currentUsername}'s Turn`;
        }

        movesList.innerHTML =
          "";

        usedMoves.forEach(
          move => {

            const tag =
              document.createElement(
                "div"
              );

            tag.className =
              "move-tag";

            tag.textContent =
              move;

            movesList.appendChild(
              tag
            );
          }
        );

        message.textContent =
          `${data.move} accepted!`;
      }
    );

    socket.on(
      "gameOver",
      data => {

        gameOver = true;

        turnText.textContent =
          "Game Over";

        message.textContent =
          `${data.loser} ran out of time!`;
      }
    );

    function submitMove() {

      if (gameOver) return;

      if (
        myPlayerNumber !==
        currentPlayer
      ) {

        message.textContent =
          "Not your turn!";

        return;
      }

      const input =
        moveInput.value.trim();

      if (!input) return;

      const validMove =
        pokemonMoves.find(
          move =>
            move.toLowerCase() ===
            input.toLowerCase()
        );

      if (!validMove) {

        message.textContent =
          "Invalid move!";

        return;
      }

      socket.emit(
        "startTimer",
        roomCode
      );

      socket.emit(
        "submitMove",
        {
          roomCode,
          move: validMove
        }
      );

      moveInput.value =
        "";

      moveInput.focus();
    }

    moveInput.addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {

          submitMove();
        }
      }
    );

  </script>

</body>

</html>
